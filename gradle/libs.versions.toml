

[versions]

#Android
androidCompileSdk = "36"
androidTargetSdk = "36"
androidMinSdk = "26"
kotlin = "2.2.20"
android-library = "8.13.0"
android-application = "8.13.0"

#Core libs
ktx = "1.17.0"
app-compat = "1.7.1"
lifecycleViewmodelCompose = "2.9.4"
mapsCompose = "6.12.1"
material = "1.13.0"

#Test
junit = "4.13.2"
junit-ext = "1.3.0"
espresso = "3.7.0"

#Google
maps = "19.2.0"

#Plugins
detekt = "1.23.8"
maps-platform = "2.0.1"
runtime = "1.9.3"
secretsGradlePlugin = "2.0.1"
lifecycle-runtime-ktx = "2.9.4"
activity-compose = "1.11.0"
compose-bom = "2025.10.00"

[libraries]
androidx-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "ktx" }
